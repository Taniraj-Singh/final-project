services: 
 
  postgres: 
    image: postgres:13 
    environment: 
      POSTGRES_DB: factory_db 
      POSTGRES_USER: admin 
      POSTGRES_PASSWORD: password 
      POSTGRES_HOST_AUTH_METHOD: trust 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
 
volumes: 
  postgres_data: 
